name: Core Network

# Deploys only when the core network, the modules it uses, or the pipeline
# itself changes.
#
# Pull requests are not path filtered at the trigger: the ruleset requires
# "Core Network / Validate", and a check from a workflow that a path filter
# skips is never reported, which would leave the pull request blocked. Instead
# every pull request starts this workflow, the changes job works out whether it
# touches the core network, and if not the pipeline's jobs are skipped, which
# reports them as passing.
#
# The paths below are listed twice, under push and under the changes job's
# filter. Keep the two lists in step.
on:
  push:
    branches:
      - main
    paths:
      - core-network/**
      - modules/**
      - .github/workflows/core-network.yml
      - .github/workflows/pipeline.yml
      - .github/workflows/plan.yml
      - .github/workflows/apply.yml
  pull_request:
    branches:
      - main

# A deploy holds its group from the first plan to the last apply, so a second
# run cannot change an environment between a plan and its apply. Shares the
# group with deploy.yml for this component. Pull request runs only validate, so
# they queue on their own branch and cancel when superseded.
concurrency:
  group: ${{ github.event_name == 'push' && 'deploy-core-network' || format('validate-core-network-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests only: a push has already been filtered by the trigger. Reads
  # the pull request's changed files from the API, so needs no checkout.
  changes:
    name: Detect Changes
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest

    permissions:
      pull-requests: read

    outputs:
      changed: ${{ steps.filter.outputs.component }}

    steps:
      - name: Filter Changed Paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            component:
              - core-network/**
              - modules/**
              - .github/workflows/core-network.yml
              - .github/workflows/pipeline.yml
              - .github/workflows/plan.yml
              - .github/workflows/apply.yml

  # Runs after changes, or without it on a push, where changes is skipped. If
  # changes fails, this is skipped too and the required check never reports,
  # so the pull request stays blocked rather than passing unchecked.
  pipeline:
    name: Core Network
    needs: changes
    if: ${{ !cancelled() && needs.changes.result != 'failure' }}
    uses: ./.github/workflows/pipeline.yml
    with:
      component: core-network
      format-paths: core-network modules
      changed: ${{ github.event_name == 'push' || needs.changes.outputs.changed == 'true' }}
    secrets: inherit
