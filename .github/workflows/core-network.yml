name: Core Network

# Deploys only when the core network, the modules it uses, or the pipeline
# itself changes. Validates every pull request, whatever it changes: the
# ruleset requires "Core Network / Validate", and a check from a workflow that a
# path filter skips is never reported, which would leave the pull request
# blocked.
on:
  push:
    branches:
      - main
    paths:
      - core-network/**
      - modules/**
      - .github/workflows/core-network.yml
      - .github/workflows/pipeline.yml
      - .github/workflows/plan.yml
      - .github/workflows/apply.yml
  pull_request:
    branches:
      - main

# A deploy holds its group from the first plan to the last apply, so a second
# run cannot change an environment between a plan and its apply. Shares the
# group with deploy.yml for this component. Pull request runs only validate, so
# they queue on their own branch and cancel when superseded.
concurrency:
  group: ${{ github.event_name == 'push' && 'deploy-core-network' || format('validate-core-network-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pipeline:
    name: Core Network
    uses: ./.github/workflows/pipeline.yml
    with:
      component: core-network
      format-paths: core-network modules
    secrets: inherit
