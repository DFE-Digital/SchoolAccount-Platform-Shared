name: Platform Shared Apply

on:
  workflow_call:
    inputs:
      component:
        type: string
        required: true
      environment:
        type: string
        required: true

env:
  # Keep in step with plan.yml and pipeline.yml.
  TF_VERSION: 1.16.5

jobs:
  apply:
    name: Apply (${{ inputs.component }}, ${{ inputs.environment }})
    runs-on: ubuntu-latest

    environment: ${{ inputs.environment }}

    env:
      ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
      ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
      ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
      ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
      COMPONENT: ${{ inputs.component }}
      ENVIRONMENT: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Download Plan
        uses: actions/download-artifact@v8
        with:
          name: tfplan-${{ inputs.component }}-${{ inputs.environment }}
          path: plans

      # A saved plan is refused if the environment's state has changed since it
      # was made, so a stale plan fails here rather than applying.
      - name: Terraform Apply
        run: |
          terraform -chdir="$COMPONENT" init -input=false -lockfile=readonly -reconfigure \
            -backend-config="environments/$ENVIRONMENT.backend.hcl"
          terraform -chdir="$COMPONENT" apply -input=false -parallelism=1 "$GITHUB_WORKSPACE/plans/tfplan"
