name: Platform Shared Apply

on:
  workflow_call:
    inputs:
      components:
        description: Components to apply, space separated, in the order to apply them
        type: string
        required: true
      environment:
        type: string
        required: true

env:
  # Keep in step with plan.yml and build.yml.
  TF_VERSION: 1.16.3

jobs:
  # One job per environment, so each environment needs one approval, and the
  # components are applied in the order given rather than in parallel. Later
  # components may depend on earlier ones, such as shared resources placed in
  # the core network's subnets.
  apply:
    name: Apply (${{ inputs.environment }})
    runs-on: ubuntu-latest

    environment: ${{ inputs.environment }}

    env:
      ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
      ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
      ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
      ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
      COMPONENTS: ${{ inputs.components }}
      ENVIRONMENT: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Each plan is downloaded to plans/tfplan-<component>-<environment>/tfplan.
      - name: Download Plans
        uses: actions/download-artifact@v8
        with:
          pattern: tfplan-*-${{ inputs.environment }}
          path: plans

      # A saved plan is refused if the environment's state has changed since it
      # was made, so a stale plan fails here rather than applying. The step
      # stops at the first failure, so a later component is never applied after
      # an earlier one fails.
      - name: Terraform Apply
        run: |
          for component in $COMPONENTS; do
            echo "::group::$component"
            terraform -chdir="$component" init -input=false -lockfile=readonly -reconfigure \
              -backend-config="environments/$ENVIRONMENT.backend.hcl"
            terraform -chdir="$component" apply -input=false -parallelism=1 \
              "$GITHUB_WORKSPACE/plans/tfplan-$component-$ENVIRONMENT/tfplan"
            echo "::endgroup::"
          done
